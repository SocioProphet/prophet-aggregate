# cargo-deny configuration.
#
# Like the rest of the stack, this crate keeps a clean, MIT-compatible bill of
# materials. CI runs `cargo deny check` and fails on any license outside the
# allowlist. AGPL and LGPL are not on it, and there is no escape hatch.
#
# Ontology data (KBpedia / KKO, CC BY 4.0) is never vendored — the resolver is
# fed edges at runtime — so `CC-BY-4.0` is intentionally absent below.

[graph]
all-features = true

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "warn"

[advisories]
version = 2
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# In-estate crates consumed as pinned git dependencies (all MIT, in-tree above).
allow-git = [
    "https://github.com/SocioProphet/prophet-sheaf",
    "https://github.com/SocioProphet/prophet-truth",
]
